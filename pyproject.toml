[tool.poetry]
name = "p3000-mptie"
version = "1.0.0"
description = "Massively Parallel Temporal Inference Engine (MPTIE)"
authors = ["Pope Troy <info@celsiustechmediagroup.co.za>"]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2.0"
ray = "^2.9.0"
