name: P3000 MPTIE Serverless Execution

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  execute-inference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests pydantic

      - name: Verify Client Module Exists
        run: |
          mkdir -p src/temporal_ingestion
          if [ ! -f src/temporal_ingestion/serverless_nim_client.py ]; then
            echo "Error: serverless_nim_client.py not found in repo."
            exit 1
          fi

      - name: Run MPTIE Temporal Inference via NVCF Serverless
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          PYTHONPATH: .
        run: |
          python3 -c "
          from src.temporal_ingestion.serverless_nim_client import ServerlessNIMEngine
          engine = ServerlessNIMEngine()
          print('Initializing active Nemotron serverless inference cluster...')
          # Using active NVIDIA Nemotron endpoint identifier
          result = engine.invoke_inference('nvidia/nemotron-3.5-lightning-30b-a3b', 'Initialize MPTIE manifold trajectory.')
          print('Inference Result:', result)
          "
